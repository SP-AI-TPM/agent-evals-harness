[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals-harness"
version = "0.1.0"
description = "A small, readable eval harness for tool-using LLM agents: trajectory grading, metrics, and CI regression gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
claude = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
agent-evals = "agent_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
