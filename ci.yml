name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Run demo suite
        run: agent-evals run --suite suites/demo_suite.yaml --agent mock-reference --out candidate.json --report report.md
      - name: Regression gate vs committed baseline
        run: agent-evals gate --baseline examples/baseline.json --candidate candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: |
            report.md
            candidate.json
